name: Demo temporary autoformat

on:
  push:
    branches:
      - feat/demo-v01-workspace

permissions:
  contents: write

concurrency:
  group: demo-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'Jimqiu1003/auralide'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Format changed demo UI
        run: pnpm exec prettier --write apps/desktop/src/renderer/document-preview.tsx apps/desktop/src/renderer/styles.css apps/desktop/test/smoke.electron.mjs
      - name: Commit formatted files if different
        shell: bash
        run: |
          git add apps/desktop/src/renderer/document-preview.tsx apps/desktop/src/renderer/styles.css apps/desktop/test/smoke.electron.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='auralide-ci' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(demo): format desktop workspace'
            git push origin HEAD:feat/demo-v01-workspace
          fi
