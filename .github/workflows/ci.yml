name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
          - target: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pinned package manager from package.json ("packageManager").
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Check platform evidence validator
        run: node --test scripts/qa/platform-evidence.test.mjs

      - name: Assert native Node, hardware and Electron identity
        run: node scripts/qa/platform-evidence.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Desktop production and development smoke
        run: pnpm --filter @auralide/desktop smoke

      - name: Durable document save, restart, reopen and preview
        run: node apps/desktop/test/persistence.electron.mjs

      - name: Upload platform evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}-${{ github.sha }}
          path: apps/desktop/test-artifacts/
          if-no-files-found: warn

  # Preserve the existing required check name; a failed/skipped matrix must never pass the gate.
  verify:
    name: verify
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both supported desktop targets
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
