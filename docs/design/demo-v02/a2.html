<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; frame-src 'self' about:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>A2 · Studio Productivity — Auralide</title>
    <link rel="stylesheet" href="prototype.css" />
    <script src="prototype.js" defer></script>
  </head>
  <body class="a2" data-variant="a2">
    <a class="skip-link" href="#stage">跳到画布</a>
    <div class="app">
      <header class="titlebar">
        <a class="brand" href="index.html" aria-label="返回三方案评审"
          ><span class="brand-mark">a</span><strong>Auralide</strong></a
        ><span class="title-divider"></span
        ><button class="document-title" data-action="menu">
          下一次出发 <span class="chevron">⌄</span></button
        ><span class="save-state" data-save-state>未保存的演示</span>
        <div class="title-actions">
          <label class="theme-control"
            ><span class="sr-only">主题</span
            ><select data-theme-picker aria-label="主题">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
              <option value="system">跟随系统</option>
            </select></label
          ><button data-action="open"><span data-icon="folder"></span>打开</button
          ><button class="primary small" data-action="save">
            <span data-icon="save"></span>保存
          </button>
        </div>
      </header>
      <nav class="studio-nav" aria-label="工作区与功能">
        <button data-action="menu" class="file-menu">文件</button
        ><button data-workspace="editor" aria-pressed="true">编辑器</button
        ><button data-workspace="aura" aria-pressed="false">Aura 预览</button
        ><span class="nav-spacer"></span
        ><button class="subtle" data-action="agent">
          <span data-icon="spark"></span>Agent · 未启用
        </button>
      </nav>
      <div class="toolbar ribbon" aria-label="常用与上下文工具">
        <div class="ribbon-section">
          <div class="tool-group">
            <button class="ribbon-tool" data-action="add-slide">
              <span data-icon="slide"></span>新建页</button
            ><button class="ribbon-tool" data-action="insert-text">
              <span data-icon="text"></span>文本框</button
            ><button class="ribbon-tool" data-action="insert-shape">
              <span data-icon="shape"></span>形状
            </button>
          </div>
          <span class="ribbon-caption">插入</span>
        </div>
        <div class="ribbon-section">
          <div class="tool-group">
            <button
              class="icon-button"
              data-action="undo"
              aria-label="撤销模拟编辑"
              data-icon="undo"
            ></button
            ><button
              class="icon-button"
              data-action="redo"
              aria-label="重做模拟编辑"
              data-icon="redo"
            ></button
            ><button data-action="delete"><span data-icon="trash"></span>删除</button>
          </div>
          <span class="ribbon-caption">编辑</span>
        </div>
        <div class="ribbon-section context-ribbon">
          <div class="tool-group">
            <span class="context-font">系统字体</span
            ><button data-action="focus-font">字号 <span data-context-size>—</span></button
            ><button data-action="bold" aria-label="切换粗体"><b>B</b></button
            ><button data-action="align" aria-label="切换文本对齐" data-icon="align"></button
            ><button data-action="focus-color" aria-label="编辑颜色">
              <span class="color-dot"></span>颜色
            </button>
          </div>
          <span class="ribbon-caption" data-selection-label>上下文 · 选择对象以编辑</span>
        </div>
      </div>
      <main class="workspace">
        <aside class="left-panel studio-left" aria-label="幻灯片与图层">
          <div class="panel-heading">幻灯片 <span class="count">3</span></div>
          <div id="slide-list" class="slide-list"></div>
          <details class="studio-layers" open>
            <summary>当前页图层 <span class="tiny muted">按前后顺序</span></summary>
            <div id="layer-list" class="layer-list"></div>
          </details>
        </aside>
        <section class="canvas-column" aria-label="画布工作区">
          <div class="canvas-topline">
            <span class="breadcrumb" data-slide-name>01 / 封面</span
            ><span class="view-label">宽屏 16:9</span>
          </div>
          <div
            id="stage"
            class="stage"
            tabindex="0"
            aria-label="演示画布，Tab 进入对象，Shift 点击多选"
          ></div>
          <section id="aura-panel" class="aura-panel" aria-label="Aura 原型预览" hidden></section>
          <div class="canvas-bottom">
            <span data-page-label>幻灯片 1 / 3</span
            ><span class="canvas-hint">单击选择 · Shift 多选</span>
            <div class="zoom-tools">
              <button data-action="zoom-out" aria-label="缩小">−</button
              ><output data-zoom>适应</output
              ><button data-action="zoom-in" aria-label="放大">+</button
              ><button data-action="zoom-fit" aria-label="适应窗口" data-icon="fit"></button>
            </div>
          </div>
        </section>
        <aside class="right-panel" aria-label="属性检查器">
          <div class="panel-heading">设置对象格式 <span data-icon="sliders"></span></div>
          <nav class="panel-tabs inspector-tabs" aria-label="检查器">
            <button data-inspector-tab="design" aria-pressed="true">格式</button
            ><button data-inspector-tab="arrange" aria-pressed="false">排列</button>
          </nav>
          <div id="inspector" class="inspector"></div>
        </aside>
      </main>
      <footer class="statusbar">
        <span class="prototype-label">交互原型 · A2 Studio Productivity</span
        ><output id="status" role="status" aria-live="polite"
          >所有编辑与文件操作仅在内存中模拟</output
        ><a href="index.html">比较方案 ↗</a>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  </body>
</html>
