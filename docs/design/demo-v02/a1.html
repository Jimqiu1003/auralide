<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; frame-src 'self' about:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>A1 · Cupertino Precision — Auralide</title>
    <link rel="stylesheet" href="prototype.css" />
    <script src="prototype.js" defer></script>
  </head>
  <body class="a1" data-variant="a1">
    <a class="skip-link" href="#stage">跳到画布</a>
    <div class="app">
      <header class="titlebar">
        <a class="brand" href="index.html" aria-label="返回三方案评审"
          ><span class="brand-mark">a</span><strong>Auralide</strong></a
        >
        <span class="title-divider"></span
        ><button class="document-title" data-action="menu">
          下一次出发 <span class="chevron">⌄</span></button
        ><span class="save-state" data-save-state>未保存的演示</span>
        <nav class="workspace-switch" aria-label="工作区">
          <button data-workspace="editor" aria-pressed="true">编辑器</button
          ><button data-workspace="aura" aria-pressed="false">
            <span data-icon="compass"></span>Aura
          </button>
        </nav>
        <div class="title-actions">
          <label class="theme-control"
            ><span class="sr-only">主题</span
            ><select data-theme-picker aria-label="主题">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
              <option value="system">跟随系统</option>
            </select></label
          ><button
            class="icon-button"
            data-action="open"
            aria-label="模拟打开"
            title="模拟打开 Ctrl / Cmd + O"
            data-icon="folder"
          ></button
          ><button class="primary small" data-action="save">
            <span data-icon="save"></span>保存
          </button>
        </div>
      </header>
      <div class="toolbar quiet-toolbar" aria-label="编辑工具">
        <div class="tool-group">
          <button
            class="icon-button"
            data-action="undo"
            aria-label="撤销模拟编辑"
            data-icon="undo"
          ></button
          ><button
            class="icon-button"
            data-action="redo"
            aria-label="重做模拟编辑"
            data-icon="redo"
          ></button>
        </div>
        <span class="divider"></span>
        <div class="tool-group">
          <button data-action="select-tool" aria-pressed="true">
            <span data-icon="cursor"></span>选择</button
          ><button data-action="insert-text"><span data-icon="text"></span>文本</button
          ><button data-action="insert-shape"><span data-icon="shape"></span>形状</button>
        </div>
        <span class="toolbar-context" data-selection-label>让想法占据中心。</span
        ><button class="subtle agent-entry" data-action="agent">
          <span data-icon="spark"></span>Agent <span class="coming">未启用</span>
        </button>
      </div>
      <main class="workspace">
        <aside class="left-panel" aria-label="幻灯片与图层">
          <nav class="panel-tabs" aria-label="左侧面板">
            <button data-left-tab="slides" aria-pressed="true">
              幻灯片 <span class="count">3</span></button
            ><button data-left-tab="layers" aria-pressed="false">图层</button>
          </nav>
          <div id="slide-list" class="slide-list"></div>
          <div id="layer-list" class="layer-list" hidden></div>
          <div class="panel-bottom">
            <span class="tiny muted">16:9 · 宽屏演示</span
            ><button class="subtle full" data-action="add-slide">
              <span data-icon="plus"></span>新建幻灯片
            </button>
          </div>
        </aside>
        <section class="canvas-column" aria-label="画布工作区">
          <div class="canvas-topline">
            <span
              ><span class="tiny-label">演示文稿</span
              ><span class="breadcrumb" data-slide-name>01 / 封面</span></span
            ><span class="view-label">适应窗口</span>
          </div>
          <div
            id="stage"
            class="stage"
            tabindex="0"
            aria-label="演示画布，Tab 进入对象，Shift 点击多选"
          ></div>
          <section id="aura-panel" class="aura-panel" aria-label="Aura 原型预览" hidden></section>
          <div class="canvas-bottom">
            <span data-page-label>幻灯片 1 / 3</span
            ><span class="canvas-hint">空格拖动画布 · 原型未启用</span>
            <div class="zoom-tools">
              <button data-action="zoom-out" aria-label="缩小">−</button
              ><output data-zoom>适应</output
              ><button data-action="zoom-in" aria-label="放大">+</button
              ><button data-action="zoom-fit" aria-label="适应窗口" data-icon="fit"></button>
            </div>
          </div>
        </section>
        <aside class="right-panel" aria-label="属性检查器">
          <nav class="panel-tabs inspector-tabs" aria-label="检查器">
            <button data-inspector-tab="design" aria-pressed="true">设计</button
            ><button data-inspector-tab="arrange" aria-pressed="false">排列</button>
          </nav>
          <div id="inspector" class="inspector"></div>
          <div class="inspector-foot"><span data-icon="shield"></span>本地优先，创作由你掌控</div>
        </aside>
      </main>
      <footer class="statusbar">
        <span class="prototype-label">交互原型 · A1 Cupertino Precision</span
        ><output id="status" role="status" aria-live="polite"
          >所有编辑与文件操作仅在内存中模拟</output
        ><a href="index.html">比较方案 <span aria-hidden="true">↗</span></a>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  </body>
</html>
