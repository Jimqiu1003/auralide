<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; frame-src 'self' about:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>A3 · Focus Layers — Auralide</title>
    <link rel="stylesheet" href="prototype.css" />
    <script src="prototype.js" defer></script>
  </head>
  <body class="a3" data-variant="a3">
    <a class="skip-link" href="#stage">跳到画布</a>
    <div class="app">
      <header class="titlebar">
        <a class="brand" href="index.html" aria-label="返回三方案评审"
          ><span class="brand-mark">a</span><strong>Auralide</strong></a
        ><button class="document-title" data-action="menu">
          下一次出发 <span class="chevron">⌄</span></button
        ><span class="save-state" data-save-state>未保存的演示</span>
        <div class="title-actions">
          <label class="theme-control"
            ><span class="sr-only">主题</span
            ><select data-theme-picker aria-label="主题">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
              <option value="system">跟随系统</option>
            </select></label
          ><button
            class="icon-button"
            data-action="open"
            aria-label="模拟打开"
            data-icon="folder"
          ></button
          ><button class="primary small" data-action="save">保存</button>
        </div>
      </header>
      <nav class="focus-nav" aria-label="工作区">
        <div class="workspace-switch">
          <button data-workspace="editor" aria-pressed="true">
            <span data-icon="slide"></span>编辑器</button
          ><button data-workspace="aura" aria-pressed="false">
            <span data-icon="compass"></span>Aura
          </button>
        </div>
        <span class="tiny muted">每个对象，都有清晰的位置。</span
        ><button class="subtle" data-action="agent">
          <span data-icon="spark"></span>Agent <span class="coming">未启用</span>
        </button>
      </nav>
      <main class="workspace">
        <aside class="left-panel focus-left" aria-label="页面与图层">
          <div class="panel-heading">
            页面
            <button
              class="icon-button"
              data-action="add-slide"
              aria-label="新增模拟幻灯片"
              data-icon="plus"
            ></button>
          </div>
          <div id="slide-list" class="slide-list compact-slides"></div>
          <div class="layer-section-heading">
            <strong>图层</strong><span class="tiny muted">前 → 后</span>
          </div>
          <div class="layer-root">
            <span data-icon="slide"></span><span data-slide-name>01 / 封面</span
            ><span class="tiny muted">16:9</span>
          </div>
          <div id="layer-list" class="layer-list focus-layer-list"></div>
          <div class="panel-bottom">
            <span class="tiny muted">Shift 点击 · 组合选择</span
            ><button class="subtle full" data-action="select-all">
              <span data-icon="layers"></span>选择本页所有对象
            </button>
          </div>
        </aside>
        <section class="canvas-column" aria-label="画布工作区">
          <div class="focus-canvas-toolbar">
            <div class="tool-group">
              <button
                class="icon-button tool-active"
                data-action="select-tool"
                aria-label="选择工具"
                data-icon="cursor"
              ></button
              ><button
                class="icon-button"
                data-action="insert-text"
                aria-label="插入模拟文本"
                data-icon="text"
              ></button
              ><button
                class="icon-button"
                data-action="insert-shape"
                aria-label="插入模拟形状"
                data-icon="shape"
              ></button
              ><span class="divider"></span
              ><button
                class="icon-button"
                data-action="undo"
                aria-label="撤销模拟编辑"
                data-icon="undo"
              ></button
              ><button
                class="icon-button"
                data-action="redo"
                aria-label="重做模拟编辑"
                data-icon="redo"
              ></button>
            </div>
            <span class="tiny muted" data-selection-label>选择对象，开始创作</span>
          </div>
          <div
            id="stage"
            class="stage"
            tabindex="0"
            aria-label="演示画布，Tab 进入对象，Shift 点击多选"
          ></div>
          <section id="aura-panel" class="aura-panel" aria-label="Aura 原型预览" hidden></section>
          <div class="canvas-bottom">
            <span data-page-label>幻灯片 1 / 3</span
            ><span class="canvas-hint">对象与图层同步选择</span>
            <div class="zoom-tools">
              <button data-action="zoom-out" aria-label="缩小">−</button
              ><output data-zoom>适应</output
              ><button data-action="zoom-in" aria-label="放大">+</button
              ><button data-action="zoom-fit" aria-label="适应窗口" data-icon="fit"></button>
            </div>
          </div>
        </section>
        <aside class="right-panel" aria-label="属性检查器">
          <nav class="panel-tabs inspector-tabs" aria-label="检查器">
            <button data-inspector-tab="design" aria-pressed="true">设计</button
            ><button data-inspector-tab="arrange" aria-pressed="false">排列</button>
          </nav>
          <div id="inspector" class="inspector"></div>
          <div class="inspector-foot"><span data-icon="shield"></span>原型不会修改你的文件</div>
        </aside>
      </main>
      <footer class="statusbar">
        <span class="prototype-label">交互原型 · A3 Focus Layers</span
        ><output id="status" role="status" aria-live="polite"
          >所有编辑与文件操作仅在内存中模拟</output
        ><a href="index.html">比较方案 ↗</a>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  </body>
</html>
