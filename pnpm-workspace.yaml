packages:
  - apps/*
  - packages/*

# No dependency currently runs an install script, so no package is listed under `allowBuilds`.
# pnpm >= 11 denies dependency build scripts by default (`strictDepBuilds` defaults to true) and
# fails the install when it meets an unreviewed one, which is the behaviour we want: review the
# script, then approve it explicitly, e.g.
#
#   allowBuilds:
#     some-native-addon: true
#
# Never use `dangerouslyAllowAllBuilds` in this repository.

# Dependencies younger than `minimumReleaseAge` are refused unless excluded below: protection
# against freshly published (possibly compromised) releases. 1440 minutes is also pnpm's built-in
# default - it is declared here so the policy is explicit and does not drift with a pnpm upgrade.
# `minimumReleaseAgeStrict` stays at its default (false), so a version inside the window is
# installed with a warning instead of failing the install.
minimumReleaseAge: 1440

# React 19.3.1 was published inside that window when this workspace was created; remove these
# entries once the versions age past the threshold.
minimumReleaseAgeExclude:
  - react@19.3.1
  - react-dom@19.3.1
